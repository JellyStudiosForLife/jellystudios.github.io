<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jelly Studios</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#111;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
        }

        /* Navigation */

        nav{
            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:25px 80px;
        }

        nav h2{
            font-size:30px;
        }

        nav ul{
            display:flex;
            list-style:none;
            gap:40px;
        }

        nav a{
            color:white;
            text-decoration:none;
            transition:.3s;
        }

        nav a:hover{
            color:#ff8c00;
        }

        /* Hero */

        .hero{

            display:flex;
            justify-content:center;
            align-items:center;

            gap:80px;

            height:85vh;

            padding:40px;

        }

        .hero img{

            width:420px;

            border-radius:15px;

        }

        .hero h1{

            font-size:80px;

        }

        .hero p{

            font-size:24px;

            margin:20px 0;

            color:#cccccc;

        }

        .buttons{

            display:flex;

            gap:20px;

        }

        button{

            padding:15px 35px;

            font-size:18px;

            border:none;

            border-radius:10px;

            cursor:pointer;

            transition:.3s;

        }

        .primary{

            background:#ff8c00;

            color:white;

        }

        .secondary{

            background:#333;

            color:white;

        }

        button:hover{

            transform:scale(1.05);

        }

    </style>

</head>

<body>

<nav>

<h2>Jelly Studios</h2>

<ul>

<li><a href="#">Home</a></li>

<li><a href="#">About</a></li>

<a href="https://jellystudiosforlife.github.io/jellystudios.github.io/games">Games</a>

</ul>

</nav>

<section class="hero">

<img src="Jelly Studios Firmenzeichen.png" alt="Jelly Studios">

<div>

<h1>Jelly Studios</h1>

<p>Creating games, Projects and more!</p>

<div class="buttons">

      <a href="https://jellystudiosforlife.github.io/jellystudios.github.io/games">
    <button class="primary">Our Games</button>

      </a>
    </a>

    <button class="secondary">Development</button>

</div>

</div>

</section>

</body>

</html>
